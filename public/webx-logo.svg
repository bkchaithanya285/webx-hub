<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" fill="none">
  <defs>
    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff1a40" />
      <stop offset="50%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Web Geometric Icon Node -->
  <g transform="translate(10, 10)">
    <!-- Outer Octagon / Web Geometry -->
    <polygon points="40,5 68,16 80,40 68,64 40,75 12,64 0,40 12,16" stroke="url(#crimsonGrad)" stroke-width="2.5" fill="rgba(76, 5, 25, 0.25)" filter="url(#glow)"/>
    <polygon points="40,18 56,26 62,40 56,54 40,62 24,54 18,40 24,26" stroke="#f43f5e" stroke-width="1.2" fill="none" opacity="0.7"/>
    <!-- Web Radial Strands -->
    <line x1="40" y1="5" x2="40" y2="75" stroke="#ff2a55" stroke-width="1.5" opacity="0.8"/>
    <line x1="0" y1="40" x2="80" y2="40" stroke="#ff2a55" stroke-width="1.5" opacity="0.8"/>
    <line x1="12" y1="16" x2="68" y2="64" stroke="#ff2a55" stroke-width="1.5" opacity="0.6"/>
    <line x1="12" y1="64" x2="68" y2="16" stroke="#ff2a55" stroke-width="1.5" opacity="0.6"/>
    <!-- Center Core Node -->
    <circle cx="40" cy="40" r="7" fill="#ffffff" filter="url(#glow)"/>
    <circle cx="40" cy="40" r="3.5" fill="#dc2626"/>
  </g>

  <!-- Typography -->
  <text x="110" y="58" font-family="'Outfit', 'Inter', sans-serif" font-weight="900" font-size="44" fill="#ffffff" letter-spacing="4">
    WEB<tspan fill="url(#crimsonGrad)" filter="url(#glow)">X</tspan>
  </text>
  
  <rect x="252" y="32" width="2" height="28" fill="#3f3f50" />
  
  <text x="266" y="44" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="13" fill="#ff2a55" letter-spacing="2.5">
    COMMAND
  </text>
  <text x="266" y="59" font-family="'Inter', sans-serif" font-weight="500" font-size="9.5" fill="#9ca3af" letter-spacing="1.5">
    CONTROL CENTER
  </text>
</svg>
